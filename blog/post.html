<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بلاگ آموزشی — متاتست</title>
  <link rel="icon" type="image/png" href="/app/favicon-32x32.png">
  <link href="/app/assets/font.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#05050A; --accent:#8B5CF6; --accent2:#A78BFA; --text:#F8F7FF; --text-mid:#C4BCE8; --text-dim:#8B87AA; --hdr:88px; }
    html { scrollbar-gutter: stable; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Alibaba', 'alibaba', system-ui, sans-serif; }
    header { height: var(--hdr); display: flex; align-items: center; justify-content: space-between; padding: 0 56px; gap: 24px; }
    .header-brand { display: flex; align-items: center; gap: 28px; }
    .logo-img { width: 60px; height: 60px; object-fit: contain; }
    .header-nav { display: flex; align-items: center; gap: 22px; }
    .nav-link { position: relative; padding: 8px 2px 10px; color: var(--text-mid); font-size: 15px; font-weight: 600; text-decoration: none; }
    .nav-link::after { content: ''; position: absolute; right: 0; bottom: 2px; height: 2px; width: 0; background: #8B5CF6; transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .nav-link:hover::after, .nav-link.active::after { width: 100%; }
    .nav-link:hover, .nav-link.active { color: var(--text); }
    .header-actions { display: flex; gap: 12px; }
    .header-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); color: var(--text-mid); text-decoration: none; font-family: inherit; white-space: nowrap; }
    .header-btn svg { width: 16px; height: 16px; flex: 0 0 16px; }
    main { max-width: 820px; margin: 0 auto; padding: 12px 56px 80px; }
    .back { color: var(--accent2); text-decoration: none; font-size: 14px; }
    h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; margin: 18px 0 10px; line-height: 1.45; }
    .meta { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }
    .cover { width: 100%; border-radius: 20px; margin-bottom: 22px; border: 1px solid rgba(255,255,255,0.08); }
    .body { color: var(--text-mid); font-size: 16.5px; line-height: 2.15; white-space: pre-wrap; }
    .status { color: var(--text-dim); }
    .modern-footer { padding: 0 56px 40px; }
    .footer-glow-line { height: 1px; max-width: 1120px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(139,92,246,0.6), transparent); }
    .footer-inner { max-width: 1120px; margin: 40px auto 0; display: flex; justify-content: space-between; gap: 24px; }
    .footer-links { list-style: none; display: flex; gap: 18px; }
    .footer-links a { color: var(--text-dim); text-decoration: none; }
    .footer-bottom { max-width: 1120px; margin: 28px auto 0; color: var(--text-dim); font-size: 13px; }
    @media (max-width: 900px) {
      header, main, .modern-footer { padding-left: 24px; padding-right: 24px; }
      .footer-inner { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-brand">
      <a href="/" aria-label="متاتست"><img src="https://metatest.app/logo.png" class="logo-img" alt="Metatest"></a>
      <nav class="header-nav">
        <a class="nav-link" href="/">صفحه اصلی</a>
        <a class="nav-link active" href="/blog/">وبلاگ</a>
      </nav>
    </div>
    <div class="header-actions">
      <a class="header-btn js-app" href="/">ورود / ثبت‌نام</a>
    </div>
  </header>
  <main>
    <a class="back" href="/blog/">بازگشت به بلاگ</a>
    <article id="article">
      <p class="status" id="status">در حال دریافت مطلب…</p>
    </article>
  </main>
  <footer class="modern-footer">
    <div class="footer-glow-line"></div>
    <div class="footer-inner">
      <strong>متاتست</strong>
      <ul class="footer-links">
        <li><a href="/#plans">پلن‌ها و تعرفه‌ها</a></li>
        <li><a href="/blog/">بلاگ آموزشی</a></li>
      </ul>
    </div>
    <div class="footer-bottom">تمامی حقوق برای متاتست محفوظ است © ۲۰۲۶</div>
  </footer>
  <script>
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }
    document.querySelectorAll('a.js-app').forEach((el) => {
      el.href = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:5173/' : '/app/';
    });
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug') || '';
    const article = document.getElementById('article');
    const SAMPLES = {
      'weekly-chapter-plan': { title: 'چطور یک فصل را در یک هفته جمع کنیم', body: 'روز اول فقط عنوان‌ها و نمودار فصل را بخوان.\nروز دوم و سوم تست آموزشی بزن و غلط‌ها را علامت بزن.\nروز چهارم همان غلط‌ها را بدون نگاه به پاسخ حل کن.', publishedAt: '2026-10-20' },
      'after-mock-exam': { title: 'بعد از آزمون آزمایشی چه کار کنیم', body: 'اول درصد هر درس را جدا بنویس.\nبعد سؤال‌هایی را که شک داشتی از سؤال‌هایی که بلد نبودی جدا کن.', publishedAt: '2026-10-18' },
      'busy-school-days': { title: 'برنامه‌ی روزهای شلوغ مدرسه', body: 'هر روز فقط یک بلوک چهل‌ دقیقه‌ای برای تست بگذار.\nاگر خسته‌ای، تعداد تست را کم کن ولی زمان را حذف نکن.', publishedAt: '2026-10-15' },
      'ask-the-ai-teacher': { title: 'چطور از معلم هوشمند متاتست سؤال بپرسیم', body: 'به‌جای «این فصل را توضیح بده» بپرس «این تست را تا کجا خودم درست رفتم؟».\nبعد از پاسخ، یک تست مشابه حل کن.', publishedAt: '2026-10-12' }
    };
    function show(post) {
      document.title = post.title + ' — متاتست';
      const cover = post.coverUrl ? '<img class="cover" alt="" src="' + esc(post.coverUrl) + '">' : '';
      const date = post.publishedAt ? new Date(post.publishedAt).toLocaleDateString('fa-IR') : '';
      article.innerHTML = '<h1>' + esc(post.title) + '</h1><p class="meta">' + esc(date) + '</p>' + cover + '<div class="body">' + esc(post.body) + '</div>';
    }
    if (!slug) {
      article.innerHTML = '<p class="status">مطلبی انتخاب نشده است.</p>';
    } else {
      fetch('/api/blog/posts/' + encodeURIComponent(slug))
        .then((res) => res.json().then((payload) => ({ ok: res.ok, payload })))
        .then(({ ok, payload }) => {
          if (ok && payload && payload.success && payload.data) return show(payload.data);
          if (SAMPLES[slug]) return show(SAMPLES[slug]);
          throw new Error('missing');
        })
        .catch(() => {
          if (SAMPLES[slug]) show(SAMPLES[slug]);
          else article.innerHTML = '<p class="status">این مطلب پیدا نشد.</p>';
        });
    }
  </script>
</body>
</html>
