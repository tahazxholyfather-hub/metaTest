<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بلاگ آموزشی — متاتست</title>
  <link rel="icon" type="image/png" href="/app/favicon-32x32.png">
  <link href="/app/assets/font.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#05050A; --accent:#8B5CF6; --accent2:#A78BFA; --text:#F8F7FF; --text-mid:#C4BCE8; --text-dim:#8B87AA; --hdr:88px; }
    html, body { background: var(--bg); color: var(--text); font-family: 'alibaba', sans-serif; }
    header { height: var(--hdr); display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
    .logo-img { width: 52px; height: 52px; }
    .header-btn { text-decoration: none; color: var(--text-mid); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 10px 14px; font-size: 13.5px; }
    main { max-width: 820px; margin: 0 auto; padding: 12px 56px 80px; }
    .back { color: var(--accent2); text-decoration: none; font-size: 14px; }
    h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; margin: 18px 0 10px; line-height: 1.45; }
    .meta { color: var(--text-dim); font-size: 13px; margin-bottom: 22px; }
    .cover { width: 100%; border-radius: 20px; margin-bottom: 22px; border: 1px solid rgba(255,255,255,0.08); }
    .body { color: var(--text-mid); font-size: 16.5px; line-height: 2.15; white-space: pre-wrap; }
    .status { color: var(--text-dim); }
    .modern-footer { padding: 0 56px 40px; }
    .footer-glow-line { height: 1px; max-width: 1120px; margin: 0 auto; background: linear-gradient(90deg, transparent, rgba(139,92,246,0.6), transparent); }
    .footer-inner { max-width: 1120px; margin: 40px auto 0; display: flex; justify-content: space-between; gap: 24px; }
    .footer-links { list-style: none; display: flex; gap: 18px; }
    .footer-links a { color: var(--text-dim); text-decoration: none; }
    .footer-bottom { max-width: 1120px; margin: 28px auto 0; color: var(--text-dim); font-size: 13px; }
    @media (max-width: 900px) {
      header, main, .modern-footer { padding-left: 24px; padding-right: 24px; }
      .footer-inner { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" aria-label="متاتست"><img src="https://metatest.app/logo.png" class="logo-img" alt="Metatest"></a>
    <a class="header-btn" href="https://metatest.app/app/">ورود / ثبت‌نام</a>
  </header>
  <main>
    <a class="back" href="/blog/">بازگشت به بلاگ</a>
    <article id="article">
      <p class="status" id="status">در حال دریافت مطلب…</p>
    </article>
  </main>
  <footer class="modern-footer">
    <div class="footer-glow-line"></div>
    <div class="footer-inner">
      <strong>متاتست</strong>
      <ul class="footer-links">
        <li><a href="/#plans">پلن‌ها و تعرفه‌ها</a></li>
        <li><a href="/blog/">بلاگ آموزشی</a></li>
      </ul>
    </div>
    <div class="footer-bottom">تمامی حقوق برای متاتست محفوظ است © ۲۰۲۶</div>
  </footer>
  <script>
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug') || '';
    const article = document.getElementById('article');
    if (!slug) {
      article.innerHTML = '<p class="status">مطلبی انتخاب نشده است.</p>';
    } else {
      fetch('/api/blog/posts/' + encodeURIComponent(slug))
        .then((res) => res.json().then((payload) => ({ ok: res.ok, payload })))
        .then(({ ok, payload }) => {
          if (!ok || !payload || !payload.success || !payload.data) throw new Error('missing');
          const post = payload.data;
          document.title = post.title + ' — متاتست';
          const cover = post.coverUrl ? '<img class="cover" alt="" src="' + esc(post.coverUrl) + '">' : '';
          const date = post.publishedAt ? new Date(post.publishedAt).toLocaleDateString('fa-IR') : '';
          article.innerHTML =
            '<h1>' + esc(post.title) + '</h1>' +
            '<p class="meta">' + esc(date) + '</p>' +
            cover +
            '<div class="body">' + esc(post.body) + '</div>';
        })
        .catch(() => { article.innerHTML = '<p class="status">این مطلب پیدا نشد.</p>'; });
    }
  </script>
</body>
</html>
